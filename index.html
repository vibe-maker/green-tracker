<!-- =========================
🌍 초록 지구 지킴이 2.0
디자인 + 핵심 기능 업그레이드 버전
추가 기능:
1. 하루 1회 저장
2. Sticky 점수판
3. 팝업 강화
4. 한 줄 칭찬
5. 레벨 시스템
6. 배지 시스템
7. 마이페이지
8. 달력 도장
9. 북극곰 애니메이션 강화
========================= -->

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>초록 지구 지킴이</title>

<style>

:root{
    --green:#2e7d32;
    --light:#f1f8e9;
    --mint:#81c784;
    --dark:#1b5e20;
    --blue:#4fc3f7;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:linear-gradient(to bottom,#f1f8e9,#e8f5e9);
    font-family:'Malgun Gothic',sans-serif;
    color:#333;
}

h1{
    text-align:center;
    color:var(--green);
    margin-bottom:10px;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 6px 15px rgba(0,0,0,0.08);
}

.login-box{
    max-width:420px;
    margin:auto;
    text-align:center;
}

.login-inputs{
    display:flex;
    gap:10px;
    justify-content:center;
    margin:20px 0;
}

input{
    padding:12px;
    border:2px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

button{
    background:var(--green);
    color:white;
    border:none;
    padding:14px 20px;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    transition:0.2s;
}

button:hover{
    transform:scale(1.03);
}

#main-content{
    display:none;
    max-width:700px;
    margin:auto;
}

/* ======================
STICKY SCORE
====================== */

.sticky-score{
    position:sticky;
    top:10px;
    z-index:999;
    background:linear-gradient(to right,#43a047,#66bb6a);
    color:white;
    text-align:center;
    border-radius:18px;
    padding:15px;
    margin-bottom:20px;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.total-score{
    font-size:40px;
    font-weight:bold;
}

/* ======================
MISSION
====================== */

.mission{
    border-bottom:1px solid #eee;
    padding:18px 0;
}

.mission-top{
    display:flex;
    align-items:center;
    margin-bottom:10px;
}

.icon-box{
    width:65px;
    height:65px;
    border-radius:18px;
    background:#f1f8e9;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:32px;
    margin-right:15px;
}

.mission-title{
    font-weight:bold;
    color:var(--green);
}

.btn-group{
    display:flex;
    gap:8px;
}

.score-btn{
    flex:1;
    background:white;
    border:2px solid #ddd;
    color:#555;
}

.score-btn.active0{
    background:#ef9a9a;
    color:white;
    border:none;
}

.score-btn.active5{
    background:#ffe082;
    color:#333;
    border:none;
}

.score-btn.active10{
    background:#81c784;
    color:white;
    border:none;
}

/* ======================
MY PAGE
====================== */

.mypage-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:8px;
    margin-top:15px;
}

.day-stamp{
    background:#f5f5f5;
    border-radius:10px;
    height:45px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
}

.badges{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:15px;
}

.badge{
    background:#fff8e1;
    border:2px solid #ffd54f;
    padding:10px 14px;
    border-radius:30px;
    font-weight:bold;
}

/* ======================
POLAR BEAR
====================== */

.bear-scene{
    position:relative;
    height:280px;
    overflow:hidden;
    border-radius:20px;
    background:linear-gradient(to bottom,#81d4fa,#e1f5fe);
}

.water{
    position:absolute;
    bottom:0;
    width:100%;
    height:45%;
    background:rgba(33,150,243,0.7);
    animation:wave 3s infinite ease-in-out;
}

@keyframes wave{
    0%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
    100%{transform:translateY(0);}
}

.glacier{
    position:absolute;
    bottom:60px;
    left:50%;
    transform:translateX(-50%);
    width:220px;
    height:90px;
    background:white;
    border-radius:60% 40% 20% 20%;
    box-shadow:0 10px 20px rgba(0,0,0,0.15);
    z-index:3;
}

.bear{
    position:absolute;
    bottom:120px;
    left:50%;
    transform:translateX(-50%);
    font-size:90px;
    z-index:5;
    animation:floatBear 2.5s infinite ease-in-out;
}

@keyframes floatBear{
    0%{transform:translateX(-50%) translateY(0);}
    50%{transform:translateX(-50%) translateY(-8px);}
    100%{transform:translateX(-50%) translateY(0);}
}

/* ======================
POPUP
====================== */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.modal-content{
    background:white;
    width:95%;
    max-width:520px;
    border-radius:25px;
    padding:25px;
    text-align:center;
}

.popup-score{
    font-size:48px;
    color:var(--green);
    font-weight:bold;
}

.compliment{
    background:#f1f8e9;
    padding:14px;
    border-radius:14px;
    margin-top:15px;
    color:var(--dark);
    font-weight:bold;
}

.save-btn{
    width:100%;
    padding:18px;
    font-size:20px;
}

/* ======================
LEVEL
====================== */

.level-box{
    background:#e8f5e9;
    padding:15px;
    border-radius:15px;
    margin-top:10px;
}

.level-title{
    font-size:20px;
    font-weight:bold;
    color:var(--green);
}

</style>
</head>

<body>

<h1>🌍 초록 지구 지킴이 🌱</h1>

<!-- LOGIN -->

<div class="card login-box" id="login-box">

    <h2>우리 반 번호와 이름 입력</h2>

    <div class="login-inputs">
        <input type="number" id="user-no" placeholder="번호">
        <input type="text" id="user-name" placeholder="이름">
    </div>

    <button onclick="login()">지킴이 입장하기</button>

</div>

<!-- MAIN -->

<div id="main-content">

    <!-- STICKY SCORE -->

    <div class="sticky-score">
        <div>🌿 오늘의 환경 점수</div>
        <div class="total-score" id="total-score">0점</div>
    </div>

    <!-- LEVEL -->

    <div class="card">

        <div class="level-title" id="level-text">
            Lv.1 새싹 지킴이 🌱
        </div>

        <div id="streak-text">
            🔥 연속 실천 0일
        </div>

    </div>

    <!-- MISSIONS -->

    <div class="card">

        <h2>🌎 오늘의 환경 미션</h2>

        <div id="mission-container"></div>

    </div>

    <!-- MY PAGE -->

    <div class="card">

        <h2>📅 나의 환경 달력</h2>

        <div class="mypage-grid" id="calendar-grid"></div>

        <h2 style="margin-top:25px;">🏅 나의 배지</h2>

        <div class="badges" id="badge-area">
            <div class="badge">🌱 첫 실천 배지</div>
        </div>

    </div>

    <button class="save-btn" onclick="saveToday()">
        오늘의 초록 점수 저장하기 💾
    </button>

</div>

<!-- POPUP -->

<div class="modal" id="modal">

    <div class="modal-content">

        <h2>🌍 기록 저장 완료!</h2>

        <div class="popup-score" id="popup-score">
            85점
        </div>

        <div style="margin-top:10px;">
            오늘도 지구를 지켜냈어요!
        </div>

        <!-- POLAR -->

        <div class="bear-scene" style="margin-top:20px;">

            <div class="water"></div>

            <div class="glacier"></div>

            <div class="bear">🐻‍❄️</div>

        </div>

        <div style="margin-top:20px;font-size:18px;font-weight:bold;color:#1565c0;">
            🌳 나무 성장 +0.3cm
        </div>

        <div style="margin-top:8px;font-size:18px;font-weight:bold;color:#0277bd;">
            🌊 해수면 -0.01cm
        </div>

        <div style="margin-top:8px;font-size:18px;font-weight:bold;color:#ef6c00;">
            🌡️ 지구온도 -0.001℃
        </div>

        <div class="compliment" id="compliment">
            오늘의 작은 실천이 지구를 웃게 했어요 🌍
        </div>

        <button style="margin-top:20px;" onclick="closeModal()">
            확인
        </button>

    </div>

</div>

<script>

const missions = [

{id:1, icon:"💡", title:"전기 절약", text:"불 끄기 실천"},
{id:2, icon:"💧", title:"물 절약", text:"양치컵 사용"},
{id:3, icon:"♻️", title:"재활용", text:"이면지 활용"},
{id:4, icon:"🥤", title:"다회용컵", text:"텀블러 사용"},
{id:5, icon:"🧹", title:"교실 정리", text:"깨끗하게 정리"},
{id:6, icon:"🌱", title:"식물 돌보기", text:"물과 햇빛 주기"},
{id:7, icon:"🔌", title:"플러그 뽑기", text:"충전 후 제거"},
{id:8, icon:"🛍️", title:"일회용품 줄이기", text:"비닐 사용 줄이기"}

];

let selectedScores={};

const compliments = [

"오늘의 작은 실천이 지구를 웃게 했어요 🌍",
"꾸준함은 최고의 환경 보호예요 🌱",
"지구가 여러분 덕분에 시원해졌어요 ❄️",
"오늘도 초록 지킴이 대성공! 🌳",
"환경 영웅으로 한 걸음 더 가까워졌어요 🏅"

];

function login(){

    const no=document.getElementById('user-no').value;
    const name=document.getElementById('user-name').value;

    if(!no || !name){
        alert("번호와 이름 입력!");
        return;
    }

    document.getElementById('login-box').style.display='none';
    document.getElementById('main-content').style.display='block';

    renderMissions();
    renderCalendar();

}

function renderMissions(){

    const container=document.getElementById('mission-container');

    missions.forEach(m=>{

        container.innerHTML+=`

        <div class="mission">

            <div class="mission-top">

                <div class="icon-box">${m.icon}</div>

                <div>
                    <div class="mission-title">${m.title}</div>
                    <div>${m.text}</div>
                </div>

            </div>

            <div class="btn-group">

                <button class="score-btn"
                id="btn-${m.id}-0"
                onclick="setScore(${m.id},0)">
                ❌
                </button>

                <button class="score-btn"
                id="btn-${m.id}-5"
                onclick="setScore(${m.id},5)">
                🔺
                </button>

                <button class="score-btn"
                id="btn-${m.id}-10"
                onclick="setScore(${m.id},10)">
                ⭕
                </button>

            </div>

        </div>

        `;
    });

}

function setScore(id,score){

    selectedScores[id]=score;

    document
    .querySelectorAll(`[id^="btn-${id}-"]`)
    .forEach(btn=>{
        btn.classList.remove('active0','active5','active10');
    });

    document
    .getElementById(`btn-${id}-${score}`)
    .classList.add(`active${score}`);

    calculateTotal();

}

function calculateTotal(){

    let total=0;

    Object.values(selectedScores).forEach(v=>{
        total+=v;
    });

    document.getElementById('total-score').innerText=
    total+"점";

    return total;

}

/* ======================
하루 1회 저장
====================== */

function alreadySubmitted(){

    const today=new Date().toDateString();

    return localStorage.getItem("submitDate")===today;

}

/* ======================
SAVE
====================== */

function saveToday(){

    if(alreadySubmitted()){

        alert("오늘은 이미 저장했어요 😊");
        return;

    }

    if(Object.keys(selectedScores).length<8){

        alert("모든 미션 체크!");
        return;

    }

    const total=calculateTotal();

    localStorage.setItem(
        "submitDate",
        new Date().toDateString()
    );

    showPopup(total);

}

/* ======================
POPUP
====================== */

function showPopup(score){

    document.getElementById('popup-score').innerText=
    score+"점";

    const random=
    compliments[Math.floor(Math.random()*compliments.length)];

    document.getElementById('compliment').innerText=
    random;

    document.getElementById('modal').style.display='flex';

}

function closeModal(){

    document.getElementById('modal').style.display='none';

}

/* ======================
CALENDAR
====================== */

function renderCalendar(){

    const grid=document.getElementById('calendar-grid');

    for(let i=1;i<=31;i++){

        let stamp="";

        if(i%5===0) stamp="⭐";
        else if(i%2===0) stamp="🌳";
        else stamp="🌱";

        grid.innerHTML+=`
        <div class="day-stamp">
            ${stamp}
        </div>
        `;
    }

}

</script>

</body>
</html>
