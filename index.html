<!-- ===========================
🌍 초록 지구 지킴이 3.0
추가 반영 사항
1. 로그인칸 크기 수정
2. 기존 급식판 UI 복구
3. 학생용 월별 현황 페이지 추가
4. 교사용 페이지 추가
=========================== -->

<style>

/* 로그인 입력칸 수정 */

.login-inputs{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:20px 0;
}

#user-no{
    width:80px;
    height:48px;
}

#user-name{
    width:140px;
    height:48px;
}

.login-inputs input{
    border:2px solid #c8e6c9;
    border-radius:12px;
    font-size:16px;
    text-align:center;
    padding:10px;
}

/* ======================
급식판
====================== */

.meal-tray{
    background:#cfd8dc;
    border-radius:25px;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:18px;
    align-items:center;
}

.tray-row{
    display:flex;
    gap:18px;
}

.food-slot{
    background:white;
    border:4px solid #b0bec5;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    font-weight:bold;
    transition:0.2s;
    color:#78909c;
}

.top-row .food-slot{
    width:85px;
    height:85px;
}

.bottom-row .food-slot{
    width:120px;
    height:120px;
    font-size:20px;
}

.food-slot:hover{
    transform:scale(1.05);
}

.food-slot.eaten{
    background:#c8e6c9;
    border-color:#43a047;
    color:#1b5e20;
    transform:scale(1.05);
}

/* ======================
학생 현황 페이지
====================== */

#dashboard-page{
    display:none;
    max-width:800px;
    margin:auto;
}

.rank-table{
    width:100%;
    border-collapse:collapse;
}

.rank-table th,
.rank-table td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:left;
}

.bar-bg{
    width:100%;
    background:#eee;
    border-radius:20px;
    overflow:hidden;
    height:18px;
}

.bar-fill{
    background:linear-gradient(to right,#43a047,#81c784);
    height:100%;
}

/* ======================
교사용 페이지
====================== */

#teacher-page{
    display:none;
    max-width:900px;
    margin:auto;
}

.teacher-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.teacher-card{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 6px 15px rgba(0,0,0,0.08);
}

.teacher-title{
    font-size:20px;
    font-weight:bold;
    color:#2e7d32;
    margin-bottom:15px;
}

.king-box{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    color:#ef6c00;
}

</style>

<!-- ======================
급식판 복구
====================== -->

<div class="card">

</div>

<div style="text-align:center;margin-top:15px;font-weight:bold;"
id="meal-score-text">

급식 점수 : 0점 / 20점

</div>

</div>

<!-- ======================
학생 현황 페이지
====================== -->

<div id="dashboard-page">

<div class="card">

<h2>🏆 우리 반 환경 지킴이 현황</h2>

<div style="margin-bottom:15px;font-weight:bold;color:#2e7d32;">

교사용 페이지
====================== -->

<div id="teacher-page">

<h1>👩‍🏫 교사용 환경 대시보드</h1>

<div class="teacher-grid">

    <!-- 학급 평균 -->

    <div class="teacher-card">

        <div class="teacher-title">
            📊 학급 평균 점수
        </div>

        <div style="font-size:42px;font-weight:bold;color:#43a047;">

        </div>

    </div>

    <!-- 환경왕 -->

    <div class="teacher-card">

        <div class="teacher-title">

        </div>

            <br><br>

<!-- 학생별 통계 -->

<div class="teacher-card" style="margin-top:20px;">

<div class="teacher-title">
📈 학생별 누적 통계
</div>

<table class="rank-table">

<tr>
<th>번호</th>
<th>이름</th>
<th>누적점수</th>
<th>연속실천</th>
<th>레벨</th>
<th>대표배지</th>
</tr>

<tbody id="teacher-table">

<script>

/* ======================
급식 점수
====================== */

function toggleFood(el){

    el.classList.toggle('eaten');

    calculateTotal();

}

function calculateMealScore(){

    const eatenCount=
    document.querySelectorAll('.food-slot.eaten').length;

    return eatenCount*4;

}

/* ======================
총점 계산
====================== */

function calculateTotal(){

    let total=0;

    Object.values(selectedScores).forEach(v=>{
        total+=v;
    });

    total+=calculateMealScore();

    document.getElementById('total-score').innerText=
    total+"점";

    document.getElementById('meal-score-text').innerText=
    `급식 점수 : ${calculateMealScore()}점 / 20점`;

    return total;

}

/* ======================
학생용 현황 페이지
====================== */

const studentData=[

{
no:1,
name:"강하영",
level:"Lv.3 🌳",
badge:"♻️",
score:1240
},

{
no:2,
name:"김루하",
level:"Lv.2 🌱",
badge:"💧",
score:980
},

{
no:3,
name:"김소은",
level:"Lv.1 🌿",
badge:"⭐",
score:650
}

];

function renderDashboard(){

    const body=document.getElementById('rank-body');

    body.innerHTML="";

    let max=1;

    studentData.forEach(s=>{
        if(s.score>max) max=s.score;
    });

    studentData.forEach(s=>{

        const percent=(s.score/max)*100;

        body.innerHTML+=`

        <tr>

            <td>${s.no}</td>

            <td style="font-weight:bold;">
                ${s.name}
            </td>

            <td>${s.level}</td>

            <td style="font-size:22px;">
                ${s.badge}
            </td>

            <td>

                <div class="bar-bg">

                    <div class="bar-fill"
                    style="width:${percent}%;">
                    </div>

                </div>

                <div style="margin-top:5px;font-weight:bold;color:#2e7d32;">
                    ${s.score}점
                </div>

            </td>

        </tr>

        `;
    });

}

/* ======================
교사용 페이지
====================== */

function renderTeacherPage(){

    const body=document.getElementById('teacher-table');

    body.innerHTML="";

    studentData.forEach(s=>{

        body.innerHTML+=`

        <tr>

            <td>${s.no}</td>

            <td>${s.name}</td>

            <td>${s.score}</td>

            <td>🔥 12일</td>

            <td>${s.level}</td>

            <td>${s.badge}</td>

        </tr>

        `;

    });

}

/* ======================
저장 후 학생 페이지 이동
====================== */

function showDashboardPage(){

    document.getElementById('main-content').style.display='none';

    document.getElementById('dashboard-page').style.display='block';

    renderDashboard();

}

/* ======================
교사 페이지 열기
====================== */

function openTeacherPage(){

    document.getElementById('dashboard-page').style.display='none';

    document.getElementById('teacher-page').style.display='block';

    renderTeacherPage();

}

/* ======================
저장 완료 후
====================== */

function closeModal(){

    document.getElementById('modal').style.display='none';

    showDashboardPage();

}

</script>
