<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌍 초록 지구 지킴이</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="main-header">
  <h1>🌍 초록 지구 지킴이 🌱</h1>
</header>

<!-- LOGIN -->
<section id="login-page" class="page">

  <div class="card">
    <h2>로그인</h2>

    <input type="text" id="user-no" placeholder="번호">
    <input type="text" id="user-name" placeholder="이름">

    <button id="login-btn">지킴이 입장하기</button>
  </div>

</section>

<!-- MAIN -->
<section id="main-page" class="page hidden">

  <div class="card">
    <h2>🌿 오늘 점수</h2>
    <div id="total-score">0점</div>
  </div>

  <div class="card">
    <h2>🍱 급식</h2>
    <div class="meal-tray">
      <div class="food-slot">반찬1</div>
      <div class="food-slot">반찬2</div>
      <div class="food-slot">반찬3</div>
      <div class="food-slot">밥</div>
      <div class="food-slot">국</div>
    </div>
    <div id="meal-score">0점</div>
  </div>

  <div class="card">
    <h2>🌎 미션</h2>
    <div id="mission-container"></div>
  </div>

  <button class="save-btn">저장</button>

  <div id="calendar-card"></div>

  <div id="graph-card"></div>

  <div id="analysis-card"></div>

</section>

<script src="data.js"></script>
<script src="app.js"></script>

</body>
</html>
